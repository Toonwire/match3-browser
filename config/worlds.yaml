- id: world_03_blue
  name: Blue
  difficulty: Hard
  description: A frigid world covered in ice and snow — stoic, unforgiving, and hauntingly serene.
  descriptionLong: Endless fields of ice stretch beneath pale skies, the land sculpted by centuries of snowstorms and biting winds. Glaciers rise like ancient monuments, and frost clings to everything—each step a whisper upon frozen earth. The cold here is not just weather, but will. Beneath the ice lie slumbering titans and forgotten relics, preserved by the planet's unwavering chill. Only the hardiest survive, shaped by isolation and resilience, their strength buried deep like heat beneath permafrost.
  primaryElement: Water
  imagePath: /assets/worlds/world_03_blue.png
  stages:
    - id: world_03_stage_01
