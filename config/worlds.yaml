- id: world_01_green
  name: Green
  difficulty: Easy
  description: A lush world covered in grass and towering trees, where nature thrives undisturbed and ancient growth protects the land's heart.
  descriptionLong: Towering trees stretch endlessly toward the sky, their intertwining canopies forming natural fortresses. Emerald grasses ripple like waves across the terrain, hiding ruins of civilizations long reclaimed by nature. The air hums with quiet wisdom—this is a land that grows stronger with time. Here, the roots run deep. Creatures born of bark and vine stand as guardians, and even the light filters through leaves as if asked permission. Travelers who enter feel both embraced and judged, as though the forest itself watches and remembers.
  primaryElement: Grass
  imagePath: /assets/worlds/world_01_green.png
  stages:
    - id: world_01_stage_00
      name: Asteroid Belt
      description: A belt of asteroids protecting the planet
      imagePath: /assets/stages/asteroid_belt.png
      enableSwapHighlight: true
      units:
        - unitId: card_00_boulder
          position: 0
          attack: 0
          hp: 10
        - unitId: card_00_boulder
          position: 1
          attack: 0
          hp: 20
        - unitId: card_00_boulder
          position: 2
          attack: 0
          hp: 30
        - unitId: card_07_wisp
          position: 3
          attack: 1
          hp: 1
      loot: loot_table_common_coins

    - id: world_01_stage_01
      name: Tree Tops
      description: The outer defenses
      imagePath: /assets/stages/tree_tops.png
      units:
        - unitId: card_07_wisp
          position: 0
        - unitId: card_07_wisp
          position: 1
      loot: loot_table_common_coins

    - id: world_01_stage_02
      name: Canopy Layer
      description: Deeper into the forest
      imagePath: /assets/stages/canopy_layer.png
      units:
        - unitId: card_07_wisp
          position: 0
        - unitId: card_07_wisp
          position: 1
        - unitId: card_04_slime
          position: 2
      loot:
        tableId: loot_table_common_coins
        entries:
          - item: card:card_07_wisp
            chance: 0.2
          - item: card:card_04_slime
            chance: 0.1

    - id: world_01_stage_03
      name: Forest Floor
      description: The heart of the forest
      imagePath: /assets/stages/forest_floor.png
      units:
        - unitId: card_04_slime
          position: 0
        - unitId: card_07_wisp
          position: 1
        - unitId: card_07_wisp
          position: 2
        - unitId: card_08_wispier
          position: 3
          effect:
            - type: damage
              description: Deal 1x grass dmg to all enemies
              elements: [Grass]
              multipliers: [1]
              targets: [Player]
              aoe: true
              cooldown: 2
          tags: [Enemy, Boss]
      loot:
        tableId: loot_table_common_coins
        entries:
          - item: card:card_07_wisp
            chance: 0.2
          - item: card:card_04_slime
            chance: 0.1
          - item: item:item_01_healing_potion
            chance: 0.05

    - id: world_01_stage_04
      name: Root System
      description: Ancient roots guard the core
      imagePath: /assets/stages/root_system.png
      units:
        - unitId: card_05_slimer
          position: 0
        - unitId: card_07_wisp
          position: 1
        - unitId: card_08_wispier
          position: 2
        - unitId: card_09_wispiest
          position: 3
          tags: [Enemy, Boss]
          effect:
            - type: damage
              description: Deal 1x grass and light dmg to all enemies
              elements: [Grass, Light]
              multipliers: [1, 1]
              targets: [Player]
              aoe: true
              cooldown: 2
      loot:
        entries:
          - item: coin
            chance: 1.0
            amount: [8, 12]
          - item: card:card_07_wisp
            chance: 0.3
          - item: card:card_08_wispier
            chance: 0.1
          - item: card:card_08_wispier
            chance: 0.1
          - item: plovmand
            chance: 0.1
      firstTimeReward:
        item: card:card_10_mutagen
        chance: 1.0
        amount: [1, 1]

- id: world_02_red
  name: Red
  difficulty: Medium
  description: A fiery world covered in lava and ash, driven by volcanic fury and inhabited by beings forged in flame and shaped by heat.
  descriptionLong: Rivers of molten lava carve glowing scars across a land of obsidian and ash. The air trembles with heat, each breath tinged with sulfur and embers. Flames dance eternally atop fractured peaks, and the ground rumbles as if the planet's heart beats with wrath. Here, power is born in the fire. Creatures of magma and smoke roam freely, volatile and devastating—true glass cannons forged in intensity. Survival is not granted, but earned in battle against the very elements.
  primaryElement: Fire
  imagePath: /assets/worlds/world_02_red.png
  stages:
    - id: world_02_stage_01
      name: Ashfall Peaks
      description: A scorched surface covered in ash and rocks
      imagePath: /assets/stages/ashfall_peaks.png
      units:
        - unitId: card_01_whelp
          position: 0
        - unitId: card_01_whelp
          position: 1
        - unitId: card_01_whelp
          position: 2
        - unitId: card_02_whelpier
          position: 3
      loot: loot_table_common_coins
    - id: world_02_stage_02
      name: Magma Flow Canyons
      description: Rivers of molten rock cutting through the landscape
      imagePath: /assets/stages/magma_flow_canyons.png
      units:
        - unitId: card_01_whelpier
          position: 0
        - unitId: card_02_whelpier
          position: 1
        - unitId: card_03_whelpiest
          position: 2
        - unitId: card_15_firebro
          position: 3
      loot: loot_table_common_coins
    - id: world_02_stage_03
      name: Inferno Basin
      description: A deep underground basin filled with molten rock
      imagePath: /assets/stages/inferno_basin.png
      units:
        - unitId: card_03_whelpiest
          position: 0
        - unitId: card_03_whelpiest
          position: 1
        - unitId: card_15_firebro
          position: 2
        - unitId: card_15_firebro
          position: 3
      loot:
        tableId: loot_table_uncommon_coins
        entries:
          - item: card:card_15_firebro
            chance: 0.2
    - id: world_02_stage_04
      name: Sacred Furnace
      description: A sacred furnace burning ever bright
      imagePath: /assets/stages/sacred_furnace.png
      units:
        - unitId: card_03_whelpiest
          position: 0
          tags: [Enemy, Boss]
