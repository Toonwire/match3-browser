          position: 0
        - unitId: unit_whelp
          position: 1
      loot: loot_table_common_coins
    - id: world_02_stage_02
      name: Magma Flow Canyons
      description: Rivers of molten rock cutting through the landscape
      imagePath: /assets/stages/magma_flow_canyons.png
      units:
        - unitId: unit_whelp
          position: 0
        - unitId: unit_whelp
          position: 1
        - unitId: unit_whelp
          position: 2
      loot: loot_table_common_coins
    - id: world_02_stage_03
      name: Inferno Basin
      description: A deep underground basin filled with molten rock
      imagePath: /assets/stages/inferno_basin.png
      units:
        - unitId: unit_whelp
          position: 0
        - unitId: unit_whelp
          position: 1
        - unitId: unit_whelp
          position: 2
        - unitId: unit_whelp
          position: 3
