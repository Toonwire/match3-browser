- id: world_01_green
  name: Green
  difficulty: Easy
  description: A lush world covered in grass and trees.
  primaryElement: Grass
  imagePath: /assets/worlds/world_01_green.png
  stages:
    - id: world_01_stage_01
      name: Tree Tops
      description: The outer defenses
      imagePath: /assets/stages/tree_tops.png
      units:
        - unitId: unit_wisp
          position: 0
        - unitId: unit_wisp
          position: 1
      loot: loot_table_common_coins

    - id: world_01_stage_02
      name: Canopy Layer
      description: Deeper into the forest
      imagePath: /assets/stages/canopy_layer.png
      units:
        - unitId: unit_wisp
          position: 0
        - unitId: unit_wisp
          position: 1
        - unitId: unit_wisp
          position: 2
      loot: loot_table_common_coins

    - id: world_01_stage_03
      name: Forest Floor
      description: The heart of the forest
      imagePath: /assets/stages/forest_floor.png
      units:
        - unitId: unit_wisp
          position: 0
        - unitId: unit_wisp
          position: 1
        - unitId: unit_wisp
          position: 2
        - unitId: unit_wisp_lieutenant
          position: 3
      loot:
        tableId: loot_table_common_coins
        entries:
          - item: card:card_07_wisp
            chance: 0.1
          - item: item:item_01_healing_potion
            chance: 0.05

    - id: world_01_stage_04
      name: Root System
      description: Ancient roots guard the core
      imagePath: /assets/stages/root_system.png
      units:
        - unitId: unit_wisp
          position: 0
        - unitId: unit_wisp_lieutenant
          position: 1
        - unitId: unit_wisp_lieutenant
          position: 2
        - unitId: unit_wisp_boss
          position: 3
      loot:
        entries:
          - item: coin
            chance: 1.0
            amount: [8, 12]
          - item: card:card_07_wisp
            chance: 0.3
          - item: card:card_08_wispier
            chance: 0.05
          - item: card:card_09_wispiest
            chance: 0.01

- id: world_02_red
  name: Red
  difficulty: Medium
  description: A fiery world covered in lava and ash.
  primaryElement: Fire
  imagePath: /assets/worlds/world_02_red.png
